[project]
name = "clps-lunar-mission-browser"
version = "0.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "pyyaml",
    "httpx",
    "uvicorn",
    "numpy>=2.5.4",
    "rasterio>=1.5.2",
]

[project.optional-dependencies]
gpu = ["torch"]

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "types-pyyaml",
    "pyproj>=3.8.0",
    "spiceypy>=8.4.0",
    "pillow>=13.0.0",
    "pyshp>=3.1.8",
    "shapely>=2.2.0",
]
reference = [
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
files = ["api", "engine", "build", "deploy"]

[[tool.mypy.overrides]]
module = ["torch", "rasterio", "rasterio.*", "shapefile", "shapely", "shapely.*"]
ignore_missing_imports = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
