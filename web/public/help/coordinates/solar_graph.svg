  <line x1="609" y1="121" x2="609" y2="189" stroke="#777" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M612,122 L612,188" stroke="#777" stroke-width="1.2" marker-start="url(#a1)" marker-end="url(#a1)"/>
  <text x="620" y="159" font-family="Arial" font-size="12" fill="#555">3.08° seasonal band</text>

  <path d="M510,102 L510,77" stroke="#b33" stroke-width="2" marker-end="url(#up)"/>
  <text x="520" y="80" font-family="Arial" font-size="12" fill="#b33">toward summer</text>
  <path d="M510,233 L510,258" stroke="#2a6fb1" stroke-width="2" marker-end="url(#down)"/>
  <text x="520" y="262" font-family="Arial" font-size="12" fill="#2a6fb1">toward winter</text>

  <text x="468" y="150" font-family="Arial" font-size="12" fill="#d6a026">current month</text>
  <text x="470" y="131" font-family="Arial" font-size="12" fill="#9e7a15">summer limit</text>
  <text x="470" y="225" font-family="Arial" font-size="12" fill="#9e7a15">winter limit</text>

  <defs>
