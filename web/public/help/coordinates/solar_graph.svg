  <path d="M70,206 C125,202 160,196 210,184 C270,168 335,156 395,154 C455,156 520,168 580,184 C630,196 665,202 720,206" fill="none" stroke="#d6a026" stroke-width="3"/>

  <path d="M70,225 C120,218 140,220 165,210 C195,198 205,148 226,150 C252,152 248,220 273,218 C298,216 305,110 333,107 C362,104 361,206 397,208 C436,210 444,163 470,160 C498,157 510,205 545,205 C580,205 584,140 612,138 C642,136 646,214 675,214 C696,214 705,205 720,202" fill="#bdbdbd" opacity="0.55"/>
  <path d="M70,225 C120,218 140,220 165,210 C195,198 205,148 226,150 C252,152 248,220 273,218 C298,216 305,110 333,107 C362,104 361,206 397,208 C436,210 444,163 470,160 C498,157 510,205 545,205 C580,205 584,140 612,138 C642,136 646,214 675,214 C696,214 705,205 720,202" fill="none" stroke="#8f8f8f" stroke-width="2"/>

