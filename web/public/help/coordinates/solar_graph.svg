<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330">
  <rect width="760" height="330" fill="white"/>
  <text x="20" y="28" font-family="Arial" font-size="20" font-weight="bold">Solar elevation band</text>
  <text x="20" y="50" font-family="Arial" font-size="12" fill="#555">Simple seasonal shift of the solar elevation curve relative to the local terrain</text>
  <line x1="70" y1="280" x2="720" y2="280" stroke="#444" stroke-width="1.5"/>
  <line x1="70" y1="40" x2="70" y2="280" stroke="#444" stroke-width="1.5"/>
  <text x="715" y="302" font-family="Arial" font-size="12" text-anchor="end">Azimuth</text>
  <text x="18" y="30" transform="rotate(-90 18 30)" font-family="Arial" font-size="12">Elevation (°)</text>
  <text x="70" y="300" font-family="Arial" font-size="11" text-anchor="middle">−180°</text>
  <text x="395" y="300" font-family="Arial" font-size="11" text-anchor="middle">0°</text>
  <text x="720" y="300" font-family="Arial" font-size="11" text-anchor="middle">180°</text>
  <text x="55" y="78" font-family="Arial" font-size="11" text-anchor="end">4°</text>
  <text x="55" y="138" font-family="Arial" font-size="11" text-anchor="end">2°</text>
  <text x="55" y="198" font-family="Arial" font-size="11" text-anchor="end">0°</text>
  <text x="55" y="258" font-family="Arial" font-size="11" text-anchor="end">−2°</text>

  <path d="M70,190 C125,186 160,180 210,168 C270,152 335,140 395,138 C455,140 520,152 580,168 C630,180 665,186 720,190" fill="none" stroke="#d6a026" stroke-width="3" stroke-dasharray="7 5"/>
