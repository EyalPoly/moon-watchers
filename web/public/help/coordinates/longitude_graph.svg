<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330">
  <rect width="760" height="330" fill="white"/>
  <text x="20" y="28" font-family="Arial" font-size="20" font-weight="bold">Longitude dependence of mean Earth elevation</text>
  <text x="20" y="50" font-family="Arial" font-size="12" fill="#555">The longitude term is cosine-based, not linear: (90° − |φ|) cos(λ)</text>

  <line x1="70" y1="165" x2="720" y2="165" stroke="#444" stroke-width="1.5"/>
  <line x1="70" y1="40" x2="70" y2="290" stroke="#444" stroke-width="1.5"/>
  <text x="715" y="312" font-family="Arial" font-size="12" text-anchor="end">Longitude λ</text>
  <text x="18" y="38" transform="rotate(-90 18 38)" font-family="Arial" font-size="12">Scaled mean elevation</text>

  <text x="70" y="185" font-family="Arial" font-size="11" text-anchor="middle">−180°</text>
  <text x="232.5" y="185" font-family="Arial" font-size="11" text-anchor="middle">−90°</text>
  <text x="395" y="185" font-family="Arial" font-size="11" text-anchor="middle">0°</text>
  <text x="557.5" y="185" font-family="Arial" font-size="11" text-anchor="middle">90°</text>
  <text x="720" y="185" font-family="Arial" font-size="11" text-anchor="middle">180°</text>

  <text x="55" y="61" font-family="Arial" font-size="11" text-anchor="end">+1</text>
  <text x="55" y="118" font-family="Arial" font-size="11" text-anchor="end">+0.5</text>
  <text x="55" y="169" font-family="Arial" font-size="11" text-anchor="end">0</text>
  <text x="55" y="222" font-family="Arial" font-size="11" text-anchor="end">−0.5</text>
  <text x="55" y="279" font-family="Arial" font-size="11" text-anchor="end">−1</text>

  <path d="M70,270 C124,270 178,238 232.5,165 C286,92 341,60 395,60 C449,60 503,92 557.5,165 C611,238 666,270 720,270" fill="none" stroke="#398ed0" stroke-width="3"/>

  <line x1="476.25" y1="165" x2="476.25" y2="89.75" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="476.25" y1="89.75" x2="395" y2="89.75" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="476.25" cy="89.75" r="4.5" fill="#d6a026"/>
  <text x="485" y="87" font-family="Arial" font-size="12" fill="#444">λ = 45°</text>
  <text x="485" y="102" font-family="Arial" font-size="12" fill="#444">cos 45° ≈ 0.707</text>

  <text x="390" y="82" font-family="Arial" font-size="12" text-anchor="end" fill="#398ed0">maximum at 0°</text>
  <text x="233" y="151" font-family="Arial" font-size="12" text-anchor="middle" fill="#398ed0">zero at ±90°</text>
  <text x="696" y="260" font-family="Arial" font-size="12" text-anchor="end" fill="#398ed0">negative beyond 90°</text>
</svg>
